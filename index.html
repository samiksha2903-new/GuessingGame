<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button class="theme-btn">🌙 Theme</button>

    <h1>🎯 Number Guessing Game</h1>

    <div class="container">
        <div class="card">
            <div class="card-header">
                🎲 Guess The Number (1-100)
            </div>
            <div class="card-body">
                <div class="input-group">
                    <label for="num">Enter Your Guess:</label>
                    <input type="number" id="num" class="input-num" min="1" max="100" placeholder="1 - 100">
                </div>

                <div class="content">
                    <p class="collection">Welcome to the Game!</p>
                </div>

                <div class="btns">
                    <button class="btn guess">🎯 Try Guessing</button>
                    <button class="btn quitBtn">🚪 Quit</button>
                </div>
            </div>
            <div class="card-footer resetButton">
                <div class="show-result"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
